<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feito. — lista de tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-card">
      <span class="brand-name">Feito.</span>
      <span class="brand-tag">um passo de cada vez</span>
    </div>

    <nav class="category-nav" id="categoryNav" aria-label="Categorias">
      <button type="button" class="category-item active" data-categoria="">Todas</button>
    </nav>
  </aside>

  <main class="content">
    <header class="content-header">
      <h1 id="viewTitle">Todas</h1>
      <p class="subtitle" id="viewSubtitle">Suas tarefas, organizadas por categoria.</p>
    </header>

    <form class="add-task-card" id="addTaskForm">
      <div class="add-task-linha-principal">
        <input type="text" id="tituloInput" placeholder="Escreva uma tarefa..." autocomplete="off" required>
        <input type="text" id="categoriaInput" list="categoriasExistentes" placeholder="Categoria (opcional)" autocomplete="off">
        <datalist id="categoriasExistentes"></datalist>
        <button type="submit">Adicionar</button>
      </div>
      <input type="text" id="descricaoInput" class="add-task-descricao" placeholder="Descrição (opcional)" autocomplete="off">
    </form>

    <div id="feedback" class="feedback" role="alert" hidden></div>

    <div id="listaTarefas" class="lista-tarefas">
      <p class="estado-vazio">Carregando tarefas...</p>
    </div>
  </main>

</div>

<!-- Modal de edição (Bootstrap) -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editForm">
        <div class="modal-header">
          <h5 class="modal-title">Editar tarefa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label" for="editTitulo">Título</label>
            <input type="text" class="form-control" id="editTitulo" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="editDescricao">Descrição</label>
            <textarea class="form-control" id="editDescricao" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="editCategoria">Categoria</label>
            <input type="text" class="form-control" id="editCategoria">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Excluir tarefa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">Tem certeza que deseja excluir "<strong id="deleteTarefaTitulo"></strong>"? Essa ação não pode ser desfeita.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Excluir</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
